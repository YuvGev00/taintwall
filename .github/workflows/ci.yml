name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      # Unit tests + zero-cost AgentDojo ground-truth replays + contamination audit
      # on the committed L1 sample (no LLM, no secrets, no dataset download).
      - name: Test
        run: uv run pytest --cov=taintwall --cov-report=term-missing
      - name: Contamination audit (committed sample)
        run: uv run python -m training.contamination_audit training/sample/sample.jsonl

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t taintwall-api .
      - name: Smoke test
        run: |
          docker run -d --name tw -p 8000:8000 taintwall-api
          for i in $(seq 30); do curl -sf localhost:8000/healthz && exit 0; sleep 1; done
          docker logs tw; exit 1

