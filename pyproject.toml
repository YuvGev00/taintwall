[project]
name = "taintwall"
version = "0.1.0"
description = "A runtime firewall for tool-using LLM agents, evaluated on AgentDojo."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "YuvGev00", email = "yuvgev1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agentdojo>=0.1.35",
    "anthropic>=1.15.0",
    "fastapi>=0.156.8",
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
detector = [
    "agentdojo[transformers]>=0.1.35",
]
dev = [
    "locust>=2.46.7",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
training = [
    "datasets>=5.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Colab notebooks follow notebook conventions (!pip, compact imports); engineering
# standards (ruff, mypy --strict) target the Python modules, not the teaching notebook.
extend-exclude = ["*.md", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "training"]

[[tool.mypy.overrides]]
module = ["agentdojo.*", "datasets.*", "transformers.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
