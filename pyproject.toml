[project]
name = "taintwall"
version = "0.1.0"
description = "A runtime firewall for tool-using LLM agents, evaluated on AgentDojo."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "YuvGev00", email = "yuvgev1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agentdojo>=0.1.35",
    "anthropic>=1.15.0",
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
detector = [
    "agentdojo[transformers]>=0.1.35",
]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["agentdojo.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
